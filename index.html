<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>María Blender - Digitale Visitenkarte</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a365d;
            --accent-color: #2b6cb0;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            overflow: hidden;
            text-align: center;
            padding: 30px 24px;
        }

        .avatar-box {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 16px auto;
            border: 4px solid #ebf8ff;
            background-color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 36px;
            font-weight: bold;
        }

        .name {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 6px;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .description {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(26, 54, 93, 0.2);
        }

        .btn-secondary {
            background-color: #edf2f7;
            color: var(--text-main);
        }

        .qr-section {
            border-top: 1px solid #edf2f7;
            padding-top: 20px;
            margin-top: 10px;
        }

        .qr-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .qr-code {
            width: 140px;
            height: 140px;
            margin: 0 auto;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 8px;
            background: #ffffff;
        }

        .qr-code img {
            width: 100%;
            height: 100%;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="avatar-box">
        MB
    </div>

    <h1 class="name">María Blender</h1>
    <p class="title">Architektin & Beraterin</p>
    <p class="description">
        Spezialistin für Bauphysik, Energieeffizienz und Wärmeschutzbestimmungen für Gebäude in Chile.
    </p>

    <div class="action-buttons">
        <a href="https://mariablender.com" target="_blank" class="btn btn-primary">
            <i class="fas fa-globe"></i> Website besuchen
        </a>
        <a href="https://www.linkedin.com/in/mariablender/" target="_blank" class="btn btn-secondary">
            <i class="fab fa-linkedin"></i> LinkedIn Profil
        </a>
        <a href="mailto:contacto@mariablender.com" class="btn btn-secondary">
            <i class="fas fa-envelope"></i> E-Mail senden
        </a>
    </div>

    <div class="qr-section">
        <p class="qr-title">Scannen zum Teilen</p>
        <div class="qr-code">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://tarjetas-de-presentacion.github.io/Visitenkarte/" alt="QR-Code María Blender">
        </div>
    </div>

    <div class="footer">
        <p>© mariablender.com</p>
    </div>
</div>

</body>
</html>
