<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>María Blender - Architektin & Beraterin</title>
  <!-- Iconos FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .card-container {
      background-color: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 0 20px 25px 20px;
    }

    /* Franja de la bandera de Alemania */
    .flag-bar {
      height: 4px;
      background: linear-gradient(to right, #000 33.3%, #dd1111 33.3%, #dd1111 66.6%, #f2c94c 66.6%);
      width: 85%;
      margin: 18px auto 16px auto;
      border-radius: 2px;
    }

    /* Tarjeta de información principal */
    .business-card {
      background-color: #f5f7fa;
      padding: 18px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card-info {
      flex: 1;
    }

    .card-info h1 {
      font-size: 1.3rem;
      color: #111827;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-info .subtitle {
      font-size: 0.85rem;
      color: #4b5563;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .card-info .description {
      font-size: 0.73rem;
      color: #6b7280;
      line-height: 1.35;
      margin-bottom: 12px;
    }

    .card-info .contact-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: #1f2937;
      margin-bottom: 6px;
      text-decoration: none;
      font-weight: 500;
    }

    .card-info .contact-item i {
      color: #4b5563;
      width: 14px;
    }

    /* Logo MB BAUPHYSIK */
    .logo-box {
      background-color: #1c2838;
      color: #ffffff;
      width: 74px;
      height: 74px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      flex-shrink: 0;
    }

    .logo-box .logo-main {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1;
    }

    .logo-box .logo-sub {
      font-size: 0.48rem;
      color: #f3b229;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }

    /* Botón Principal "In Kontakten speichern" */
    .btn-main {
      background-color: #1c2838;
      color: #ffffff;
      text-decoration: none;
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    /* Botón WhatsApp */
    .btn-whatsapp {
      background-color: #25d366;
      color: #ffffff;
      text-decoration: none;
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn-whatsapp i {
      font-size: 1.1rem;
    }

    /* Botones 2x2 */
    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 25px;
    }

    .btn-grid {
      background-color: #f0f3f8;
      color: #1c2838;
      text-decoration: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-grid i {
      font-size: 0.9rem;
      color: #4b5563;
    }

    /* Sección Código QR */
    .qr-section {
      text-align: center;
    }

    .qr-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #6b7280;
      margin-bottom: 12px;
    }

    .qr-code-box {
      background-color: #f0f3f8;
      padding: 14px;
      border-radius: 20px;
      display: inline-block;
    }

    .qr-code-box img {
      width: 130px;
      height: 130px;
      display: block;
    }

    .copyright {
      font-size: 0.72rem;
      color: #9ca3af;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- Franja Superior Alemania -->
    <div class="flag-bar"></div>

    <!-- Tarjeta Principal de Información -->
    <div class="business-card">
      <div class="card-info">
        <h1>María Blender</h1>
        <div class="subtitle">Architektin & Beraterin</div>
        <div class="description">
          Bauphysik | Energieeffizienz | Wärmeschutz für Gebäude in Chile
        </div>
        <a href="mailto:contacto@mariablender.com" class="contact-item">
          <i class="fa-regular fa-envelope"></i> contacto@mariablender.com
        </a>
        <a href="https://www.mariablender.com" target="_blank" rel="noopener noreferrer" class="contact-item">
          <i class="fa-solid fa-globe"></i> www.mariablender.com
        </a>
      </div>

      <!-- Logo "MB BAUPHYSIK" -->
      <div class="logo-box">
        <div class="logo-main">MB</div>
        <div class="logo-sub">BAUPHYSIK</div>
      </div>
    </div>

    <!-- 1. Botón "In Kontakten speichern" -->
    <a href="data:text/vcard;charset=utf-8,BEGIN%3AVCARD%0AVERSION%3A3.0%0AN%3ABlender%3BMar%C3%ADa%3B%3B%3B%0AFN%3AMar%C3%ADa%20Blender%0AORG%3AMB%20BAUPHYSIK%0ATITLE%3AArchitektin%20%26%20Beraterin%0ATEL%3BTYPE%3DCELL%3A%2B56995362673%0AEMAIL%3Acontacto%40mariablender.com%0AURL%3Ahttps%3A%2F%2Fwww.mariablender.com%0AEND%3AVCARD" download="Maria_Blender.vcf" class="btn-main">
      <i class="fa-solid fa-address-card"></i> In Kontakten speichern
    </a>

    <!-- 2. Botón "WhatsApp Nachricht" -->
    <a href="https://wa.me/56995362673" target="_blank" rel="noopener noreferrer" class="btn-whatsapp">
      <i class="fa-brands fa-whatsapp"></i> WhatsApp Nachricht
    </a>

    <!-- Botones 2x2 -->
    <div class="buttons-grid">
      <!-- Email -->
      <a href="mailto:contacto@mariablender.com" class="btn-grid">
        <i class="fa-regular fa-envelope"></i> E-Mail
      </a>

      <!-- Website -->
      <a href="https://www.mariablender.com" target="_blank" rel="noopener noreferrer" class="btn-grid">
        <i class="fa-solid fa-globe"></i> Website
      </a>

      <!-- LinkedIn -->
      <a href="https://www.linkedin.com/in/mblender" target="_blank" rel="noopener noreferrer" class="btn-grid">
        <i class="fa-brands fa-linkedin"></i> LinkedIn
      </a>

      <!-- Anrufen -->
      <a href="tel:+56995362673" class="btn-grid">
        <i class="fa-solid fa-phone"></i> Anrufen
      </a>
    </div>

    <!-- Código QR -->
    <div class="qr-section">
      <div class="qr-title">SCANNEN ZUM TEILEN</div>
      <div class="qr-code-box">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.mariablender.com" alt="QR Code">
      </div>
      <div class="copyright">&copy; mariablender.com</div>
    </div>
  </div>

</body>
</html>
