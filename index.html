<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>María Blender - Visitenkarte</title>
  <!-- Iconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #8c929a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .card-container {
      background-color: #e2e5eb;
      width: 100%;
      max-width: 400px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      padding-bottom: 30px;
    }

    /* Franja de la bandera de Alemania */
    .flag-bar {
      height: 5px;
      background: linear-gradient(to right, #000 33.3%, #dd0000 33.3%, #dd0000 66.6%, #ffce00 66.6%);
      width: 80%;
      margin: 22px auto 18px auto;
      border-radius: 3px;
    }

    /* Tarjeta de información */
    .business-card {
      background-color: #d1d5dd;
      margin: 0 18px 20px 18px;
      padding: 18px;
      border-radius: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .card-info {
      flex: 1;
    }

    .card-info h1 {
      font-size: 1.25rem;
      color: #1a1a1a;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-info .subtitle {
      font-size: 0.78rem;
      color: #333;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card-info .description {
      font-size: 0.7rem;
      color: #555;
      line-height: 1.35;
      margin-bottom: 12px;
    }

    .card-info .contact-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.73rem;
      color: #2b2b2b;
      margin-bottom: 4px;
      text-decoration: none;
    }

    /* Logo MB BAUPHYSIK */
    .logo-box {
      background-color: #1b2333;
      color: #ffffff;
      width: 72px;
      height: 72px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      flex-shrink: 0;
    }

    .logo-box .logo-main {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1;
    }

    .logo-box .logo-sub {
      font-size: 0.48rem;
      color: #d4af37;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-top: 3px;
    }

    /* Botones de Acción (2x2) */
    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 18px;
      margin-bottom: 25px;
    }

    .btn {
      background-color: #cbcfd8;
      color: #23272d;
      text-decoration: none;
      padding: 12px;
      border-radius: 14px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #bdc1cb;
    }

    .btn i {
      font-size: 0.95rem;
      color: #3e444e;
    }

    /* Sección Código QR */
    .qr-section {
      text-align: center;
    }

    .qr-title {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #555d68;
      margin-bottom: 12px;
    }

    .qr-code-box {
      background-color: #ffffff;
      padding: 12px;
      border-radius: 18px;
      display: inline-block;
    }

    .qr-code-box img {
      width: 130px;
      height: 130px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- Franja Superior con los colores de Alemania -->
    <div class="flag-bar"></div>

    <!-- Tarjeta Principal -->
    <div class="business-card">
      <div class="card-info">
        <h1>María Blender</h1>
        <div class="subtitle">Freie Architektin | M.Sc. Univ. Stuttgart</div>
        <div class="description">
          Bauphysik | Energieeffizienz | Nachhaltigkeit | Barrierefreiheit in Chile
        </div>
        <a href="mailto:mail@mariablender.com" class="contact-item">
          <i class="fa-regular fa-envelope"></i> mail@mariablender.com
        </a>
        <a href="https://www.mariablender.com" target="_blank" rel="noopener noreferrer" class="contact-item">
          <i class="fa-solid fa-globe"></i> www.mariablender.com
        </a>
      </div>

      <!-- Logo "MB BAUPHYSIK" -->
      <div class="logo-box">
        <div class="logo-main">MB</div>
        <div class="logo-sub">BAUPHYSIK</div>
      </div>
    </div>

    <!-- Botones de Acción -->
    <div class="buttons-grid">
      <!-- 1. Email -->
      <a href="mailto:mail@mariablender.com" class="btn">
        <i class="fa-regular fa-envelope"></i> E-Mail
      </a>

      <!-- 2. Website -->
      <a href="https://www.mariablender.com" target="_blank" rel="noopener noreferrer" class="btn">
        <i class="fa-solid fa-globe"></i> Website
      </a>

      <!-- 3. LinkedIn -->
      <a href="https://www.linkedin.com/in/mblender" target="_blank" rel="noopener noreferrer" class="btn">
        <i class="fa-brands fa-linkedin"></i> LinkedIn
      </a>

      <!-- 4. Teléfono -->
      <a href="tel:+56995362673" class="btn">
        <i class="fa-solid fa-phone"></i> Anrufen
      </a>
    </div>

    <!-- Código QR -->
    <div class="qr-section">
      <div class="qr-title">SCANNEN ZUM TEILEN</div>
      <div class="qr-code-box">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://www.mariablender.com" alt="QR Code">
      </div>
    </div>
  </div>

</body>
</html>
